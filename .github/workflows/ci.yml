name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A build failure is more useful than a warning nobody reads.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install liboqs build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # liboqs is compiled from source, so caching is the difference between a
      # two-minute job and a ten-minute one.
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build release binary
        run: cargo build --release --locked

      - name: End-to-end smoke test
        run: scripts/smoke target/release/pqsum

      - uses: actions/upload-artifact@v4
        with:
          name: pqsum-linux-x86_64
          path: target/release/pqsum
          if-no-files-found: error

  minimum-rust-version:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install liboqs build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libclang-dev pkg-config

      # Keep this in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image and check it end to end
        run: scripts/check-image pqsum:ci
